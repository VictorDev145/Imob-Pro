spring:
  application:
    name: imob-pro-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/imobpro}
    username: ${DB_USERNAME:imobpro}
    password: ${DB_PASSWORD:imobpro_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
