name: Kotlin API CI

on:
  push:
    paths:
      - "backend-kotlin/**"
      - ".github/workflows/kotlin-api-ci.yml"
  pull_request:
    paths:
      - "backend-kotlin/**"
      - ".github/workflows/kotlin-api-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: imobpro
          POSTGRES_USER: imobpro
          POSTGRES_PASSWORD: imobpro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U imobpro -d imobpro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend-kotlin
    env:
      DB_URL: jdbc:postgresql://localhost:5432/imobpro
      DB_USERNAME: imobpro
      DB_PASSWORD: imobpro_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        run: gradle --no-daemon test
      - name: Build
        run: gradle --no-daemon bootJar
