services:
  postgres:
    image: postgres:17-alpine
    container_name: imobpro-postgres
    environment:
      POSTGRES_DB: imobpro
      POSTGRES_USER: imobpro
      POSTGRES_PASSWORD: ${DB_PASSWORD:-imobpro_dev}
    ports:
      - "5432:5432"
    volumes:
      - imobpro_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imobpro -d imobpro"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: imobpro-api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/imobpro
      DB_USERNAME: imobpro
      DB_PASSWORD: ${DB_PASSWORD:-imobpro_dev}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  imobpro_postgres_data:
